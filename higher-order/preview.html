<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[미리보기] 2×2 개편 — 입사·산란·전체 + 모드 그래프</title>
<style>
:root { --bg:#0e1020; --fg:#e8ebf5; --mut:#8892b5; }
* { box-sizing:border-box; }
body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
  font-family:"Segoe UI",system-ui,sans-serif; }
h1 { font-size:1.15rem; margin:0 0 4px; }
.sub { color:var(--mut); font-size:0.85rem; margin:0 0 6px; max-width:820px; }
.scale-note { color:var(--mut); font-size:0.82rem; margin:0 0 12px; max-width:820px; }
.pvbadge { display:inline-block; background:#3a2a10; color:#f4a261; border:1px solid #6a4a1a;
  border-radius:6px; padding:2px 8px; font-size:0.78rem; margin-bottom:8px; }

/* 2×2 그리드: 좌상 입사 · 우상 전체 · 좌하 산란 · 우하 그래프 */
.grid2x2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start; max-width:1120px; }
.panel { background:#161b2e; border:1px solid #2a3050; border-radius:10px; padding:10px 12px; }
.panel h3 { margin:0 0 6px; font-size:0.95rem; color:#d6dcf7; font-weight:600; }
.cvwrap { position:relative; display:block; width:100%; }
.cvwrap canvas { width:100%; height:auto; display:block; background:#0a0c18;
  border:1px solid #2a3050; image-rendering:pixelated; }
#cvInc, #cvScat, #cvTot { aspect-ratio: 520 / 220; }
#cvGraph { image-rendering:auto; aspect-ratio: 620 / 240; }
.cv-label { position:absolute; font-size:0.72rem; line-height:1; pointer-events:none; white-space:nowrap; }
.cv-label-center { transform:translateX(-50%); }
@media (max-width:900px){ .grid2x2 { grid-template-columns:1fr; } }

#controls { margin-top:14px; max-width:1120px; }
.row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:6px 0; }
.row label { min-width:120px; color:var(--mut); font-size:0.85rem; }
button { background:#1b2140; color:var(--fg); border:1px solid #3a4270;
  border-radius:6px; padding:5px 10px; cursor:pointer; font-size:0.85rem; }
button:hover { background:#252d54; }
.warn { color:#f4a261; }
.tcap { color:var(--mut); font-size:0.78rem; margin:2px 0 6px; }
#readouts { margin-top:10px; max-width:1120px; }
.mode1 { color:#4a90d9; } .mode2 { color:#3fb56b; } .mode3 { color:#e8913a; }
</style></head>
<body>
<span class="pvbadge">미리보기 — 실제 파일 미반영</span>
<h1>도체도선배열을 이용한 입사파-산란파 중첩 모형</h1>
<p class="sub">벽=두 줄 도선, 각 도선 표면 경계조건으로 산란파 결정(MoM). 내부 장 = 입사파+산란파.
모드 분해는 n=1–3만 표시(n≥4 미표시).</p>
<p class="scale-note">도파관 폭 a = 60 셀 = 60 mm (= 6 cm), 차단 파장 λ_c = 2a = 120 mm ≈ 전자레인지 2.5 GHz</p>

<div class="grid2x2">
  <section class="panel"><h3>입사파 (소스 도선)</h3>
    <div class="cvwrap"><canvas id="cvInc"></canvas></div></section>
  <section class="panel"><h3>전체장 = 입사 + 산란</h3>
    <div class="cvwrap"><canvas id="cvTot"></canvas></div></section>
  <section class="panel"><h3>산란파 (벽 도선)</h3>
    <div class="cvwrap"><canvas id="cvScat"></canvas></div></section>
  <section class="panel"><h3>모드 분해 그래프</h3>
    <div class="cvwrap"><canvas id="cvGraph" width="620" height="240"></canvas></div></section>
</div>

<div id="controls">
  <div class="row"><label>λ / a</label>
    <input id="lambda" type="range" min="0.4" max="2.5" step="0.01" value="1.5">
    <span id="lambdaVal"></span></div>
  <div class="row"><label>소스 y₀ / a</label>
    <input id="y0" type="range" min="0.05" max="0.95" step="0.01" value="0.5">
    <span id="y0Val"></span><button id="centerBtn">중심으로</button></div>
  <div class="row"><label>도선 간격 d</label>
    <input id="dWire" type="range" min="2" max="20" step="1" value="5" disabled>
    <span id="dVal"></span>
    <label style="min-width:auto"><input id="dAuto" type="checkbox" checked> 자동(d=0.055λ)</label></div>
  <div class="row"><label>프리셋</label>
    <button data-preset="1">① 완전차단 2.4a</button>
    <button data-preset="2">② 단일모드 1.5a</button>
    <button data-preset="3">③ 2모드 0.8a·y₀=a/4</button>
    <button data-preset="4">④ 3모드 0.55a·y₀=a/6</button></div>
  <div class="row">
    <button id="pauseBtn">⏸ 일시정지</button>
    <label style="min-width:auto">속도</label>
    <input id="speed" type="range" min="0" max="0.4" step="0.01" value="0.15"></div>
</div>
<div id="readouts"></div>

<!-- 공유 물리 코어(수정 안 함) -->
<script src="../core.js"></script>
<script src="../hankel.js"></script>
<script src="../field.js"></script>
<!-- higher-order 데이터(수정 안 함) -->
<script src="modes.js"></script>

<!-- ↓↓↓ 아래 3개 인라인 블록 = 실제 반영될 render-ho.js / graph.js / script.js 내용 ↓↓↓ -->

<!-- [블록 A] render-ho.js — higher-order 전용 렌더(감마 0.6 + 벽선 + '입구 (z=0)') -->
<script>
(function (global) {
  'use strict';
  // 루트 ../render.js를 건드리지 않기 위해 필요한 draw 함수만 WG에 로컬 정의.
  // §3-1 감마 0.6(부호 보존) · §3-2 벽 가이드선 · §3-3 '입구 (z=0)'
  function colorForValue(v, scale) {
    var t = v / scale;
    var sign = t < 0 ? -1 : 1;
    var mag = Math.min(1, Math.abs(t));
    t = sign * Math.pow(mag, 0.6);
    if (t >= 0) { var c = Math.round(255 * (1 - t)); return { r: 255, g: c, b: c }; }
    var d = Math.round(255 * (1 + t)); return { r: d, g: d, b: 255 };
  }
  function drawField(ctx, field, scale, phase) {
    var Nx = field.Nx, Ny = field.Ny, re = field.re, im = field.im;
    var img = ctx.createImageData(Nx, Ny), d = img.data, c = Math.cos(phase), s = Math.sin(phase);
    for (var i = 0; i < Nx; i++) for (var j = 0; j < Ny; j++) {
      var idx = i * Ny + j, v = re[idx] * c + im[idx] * s, col = colorForValue(v, scale);
      var p = ((Ny - 1 - j) * Nx + i) * 4;
      d[p] = col.r; d[p + 1] = col.g; d[p + 2] = col.b; d[p + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }
  function drawWireDots(ctx, wiresPix, cre, cim, phase, scale, Ny) {
    var c = Math.cos(phase), s = Math.sin(phase);
    for (var j = 0; j < wiresPix.length; j++) {
      var v = cre[j] * c + cim[j] * s;
      var mag = Math.abs(v) / scale; if (mag > 1) mag = 1;
      var col = colorForValue(v, scale);
      var cx = wiresPix[j].x, cy = Ny - 1 - wiresPix[j].y;
      var rad = 2.2 + 2.3 * mag;
      ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2);
      ctx.fillStyle = 'rgb(' + col.r + ',' + col.g + ',' + col.b + ')';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 0.8; ctx.stroke();
    }
  }
  function drawPlatesWire(ctx, geom) {
    var Nx = geom.Nx, Ny = geom.Ny, y0 = geom.y0, a = geom.a, xLeft = geom.xLeft, L = geom.L;
    var yTop = Ny - 1 - (y0 + a / 2), yBot = Ny - 1 - (y0 - a / 2);
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.fillRect(xLeft, yTop, L, yBot - yTop);           // 도파관 내부 밴드(벽 사이)
    // §3-2 벽 위치 1px 실선(상·하) — 경계를 또렷하게
    ctx.strokeStyle = 'rgba(154,166,216,0.55)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(xLeft, yTop + 0.5); ctx.lineTo(xLeft + L, yTop + 0.5);
    ctx.moveTo(xLeft, yBot - 0.5); ctx.lineTo(xLeft + L, yBot - 0.5);
    ctx.stroke();
    // 입구(z=0) 세로 안내선
    ctx.strokeStyle = 'rgba(154,166,216,0.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(xLeft, 0); ctx.lineTo(xLeft, Ny); ctx.stroke();
  }
  function updateOverlays(wraps, geom) {
    var Nx = geom.Nx, Ny = geom.Ny, y0 = geom.y0, a = geom.a, xLeft = geom.xLeft;
    function clear(w) { var e = w.getElementsByClassName('cv-label'); while (e.length) e[0].parentNode.removeChild(e[0]); }
    function mk(w, text, leftPct, topPct, center, color) {
      var s = document.createElement('span'); s.className = 'cv-label' + (center ? ' cv-label-center' : '');
      s.style.left = leftPct.toFixed(2) + '%'; s.style.top = topPct.toFixed(2) + '%'; s.style.color = color; s.textContent = text; w.appendChild(s);
    }
    var yTop = Ny - 1 - (y0 + a / 2), yBot = Ny - 1 - (y0 - a / 2);
    [wraps.inc, wraps.scat, wraps.tot].forEach(function (w) {
      if (!w) return;
      clear(w);
      mk(w, '도선 벽', (xLeft + 4) / Nx * 100, (yTop - 14) / Ny * 100, false, '#9aa6d8');
      mk(w, '도선 벽', (xLeft + 4) / Nx * 100, (yBot + 2) / Ny * 100, false, '#9aa6d8');
      mk(w, '입구 (z=0)', xLeft / Nx * 100, 2, true, '#8a94c0');
    });
  }
  global.WG = global.WG || {};
  global.WG.colorForValue = colorForValue;
  global.WG.drawField = drawField;
  global.WG.drawWireDots = drawWireDots;
  global.WG.drawPlatesWire = drawPlatesWire;
  global.WG.updateOverlays = updateOverlays;
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>

<!-- [블록 B] graph.js (개편) — y축 라벨 · 실선/점선 범례 · 수치바닥 아래 반투명 -->
<script>
(function (global) {
  'use strict';
  var COLORS = { 1: '#4a90d9', 2: '#3fb56b', 3: '#e8913a' };

  function drawModeGraph(ctx, s, CFG) {
    var W = ctx.canvas.width, H = ctx.canvas.height, padL = 52, padB = 30, padT = 16, padR = 12;
    ctx.clearRect(0, 0, W, H);
    var a = CFG.a, k = s.k, y0pix = CFG.y0pix, xLeft = CFG.xLeft, L = CFG.L;

    var kappas = [1, 2, 3].map(function (n) { return WGM.theoryKappa(n, a, k); }).filter(function (v) { return v; });
    var kappaMin = kappas.length ? Math.min.apply(null, kappas) : null;
    var win = WGM.fitWindowZ(CFG.z0, L, kappaMin);

    var amps = {}, refIPix = Math.round(win.zStart) + xLeft, norm = 1e-9;
    [1, 2, 3].forEach(function (n) {
      amps[n] = WGM.modeCoefGridN(s.tot, y0pix, a, n);
      if (amps[n][refIPix] > norm) norm = amps[n][refIPix];
    });

    var decades = 4, yMaxLog = 0.3;
    function X(zc) { return padL + (zc / L) * (W - padL - padR); }
    function Y(val) {
      var lg = Math.log(Math.max(val, 1e-12) / norm) / Math.LN10;
      var t = (yMaxLog - lg) / decades; if (t < 0) t = 0; if (t > 1) t = 1;
      return padT + t * (H - padT - padB);
    }
    ctx.strokeStyle = '#2a3050'; ctx.strokeRect(padL, padT, W - padL - padR, H - padT - padB);
    ctx.fillStyle = '#8892b5'; ctx.font = '11px "Segoe UI",sans-serif';
    for (var dd = 0; dd <= decades; dd++) {
      var yy = padT + (dd / decades) * (H - padT - padB);
      ctx.strokeStyle = '#1b2140'; ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(W - padR, yy); ctx.stroke();
      ctx.textAlign = 'right'; ctx.fillText('1e' + (Math.round(yMaxLog) - dd), padL - 5, yy + 4);
    }
    ctx.textAlign = 'center'; ctx.fillText('z (진행축)', (padL + W) / 2, H - 4);
    // §3-4 y축 세로 라벨
    ctx.save();
    ctx.translate(13, padT + (H - padT - padB) / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.textAlign = 'center'; ctx.fillStyle = '#8892b5'; ctx.font = '11px "Segoe UI",sans-serif';
    ctx.fillText('|cₙ(z)|  (모드 계수 크기, 로그)', 0, 0);
    ctx.restore();

    ctx.fillStyle = 'rgba(154,166,216,0.08)';
    ctx.fillRect(X(win.zStart), padT, X(win.zEnd) - X(win.zStart), H - padT - padB);

    var floorThresh = norm * 1e-4; // §3-6 수치 바닥(하단 1e-4 데케이드)
    [1, 2, 3].forEach(function (n) {
      var col = COLORS[n];
      // 실측 실선 — 바닥 아래 구간은 반투명(0.25)
      ctx.lineWidth = 1.8; ctx.setLineDash([]); ctx.strokeStyle = col;
      var seg = [], curBelow = null;
      function strokeSeg(pts, below) {
        if (pts.length < 2) return;
        ctx.globalAlpha = below ? 0.25 : 1; ctx.beginPath();
        for (var q = 0; q < pts.length; q++) { if (q === 0) ctx.moveTo(pts[q].x, pts[q].y); else ctx.lineTo(pts[q].x, pts[q].y); }
        ctx.stroke();
      }
      for (var zc = 0; zc <= L; zc += 1) {
        var v = amps[n][Math.round(zc) + xLeft];
        var below = v < floorThresh, pt = { x: X(zc), y: Y(v) };
        if (curBelow === null) { curBelow = below; seg = [pt]; }
        else if (below === curBelow) { seg.push(pt); }
        else { seg.push(pt); strokeSeg(seg, curBelow); seg = [pt]; curBelow = below; }
      }
      strokeSeg(seg, curBelow);
      ctx.globalAlpha = 1;

      // 이론 점선
      var kap = WGM.theoryKappa(n, a, k), kz = WGM.theoryKz(n, a, k);
      ctx.strokeStyle = col; ctx.lineWidth = 1.2; ctx.setLineDash([5, 4]); ctx.beginPath();
      if (kap) {
        var kwin = WGM.kappaWindowN(L, kap, s.d);
        var anchorI = Math.round(kwin.zStart) + xLeft;
        var anchor = amps[n][anchorI];
        for (var zc2 = kwin.zStart; zc2 <= L; zc2 += 1) {
          var tv = anchor * Math.exp(-kap * (zc2 - kwin.zStart));
          if (zc2 === kwin.zStart) ctx.moveTo(X(zc2), Y(tv)); else ctx.lineTo(X(zc2), Y(tv));
        }
      } else if (kz) {
        var h = theoryHeight(n, s, CFG, win, amps, xLeft);
        ctx.moveTo(X(win.zStart), Y(h)); ctx.lineTo(X(L), Y(h));
      }
      ctx.stroke(); ctx.setLineDash([]);
    });

    drawLegend(ctx, padL, padT);
    if (s.dOverLambda > 0.1 || s.wallT > 0.35) drawCollapseWarn(ctx, W, padT);
  }

  function theoryHeight(n, s, CFG, win, amps, xLeft) {
    var a = CFG.a, k = s.k, y0spec = window.__hoState.y0spec;
    var base = geoMean(amps[1], Math.round(win.zStart) + xLeft, Math.round(win.zEnd) + xLeft);
    var amp1 = WGM.theoryPropAmp(1, y0spec, a, k), ampN = WGM.theoryPropAmp(n, y0spec, a, k);
    if (!amp1 || amp1 < 1e-12 || ampN === null) return base;
    return base * (ampN / amp1);
  }
  function geoMean(arr, i0, i1) { var sIn = 0, c = 0;
    for (var i = i0; i <= i1; i++) { var v = arr[i]; if (v < 1e-14) v = 1e-14; sIn += Math.log(v); c++; }
    return c ? Math.exp(sIn / c) : 1e-9; }

  function drawLegend(ctx, x, y) {
    ctx.textAlign = 'left'; ctx.font = '11px "Segoe UI",sans-serif';
    var items = [[1, 'mode1'], [2, 'mode2'], [3, 'mode3']];
    items.forEach(function (it, i) {
      var yy = y + 12 + i * 15; ctx.strokeStyle = COLORS[it[0]]; ctx.lineWidth = 2;
      ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(x + 8, yy); ctx.lineTo(x + 26, yy); ctx.stroke();
      ctx.fillStyle = COLORS[it[0]]; ctx.fillText(it[1], x + 32, yy + 4);
    });
    // §3-5 실선/점선 샘플 획
    var lx = x + 92;
    ctx.strokeStyle = '#aab2cf'; ctx.lineWidth = 1.8; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(lx, y + 9); ctx.lineTo(lx + 22, y + 9); ctx.stroke();
    ctx.fillStyle = '#8892b5'; ctx.fillText('실측(MoM)', lx + 28, y + 12);
    ctx.strokeStyle = '#aab2cf'; ctx.lineWidth = 1.2; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(lx, y + 24); ctx.lineTo(lx + 22, y + 24); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#8892b5'; ctx.fillText('이론', lx + 28, y + 27);
    ctx.fillText('(n≥4 미표시)', lx, y + 42);
  }
  function drawCollapseWarn(ctx, W, y) {
    ctx.fillStyle = '#f4a261'; ctx.textAlign = 'right'; ctx.font = 'bold 12px "Segoe UI",sans-serif';
    ctx.fillText('⚠ 벽 근사 무너짐 — 모드 분해 신뢰도 낮음', W - 16, y + 12);
  }

  global.WG = global.WG || {}; global.WG.drawModeGraph = drawModeGraph;
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>

<!-- [블록 C] script.js (개편) — 3캔버스 공통 스케일 · 오버레이 · mm 병기 · T 캡션 -->
<script>
(function () {
  'use strict';
  var core = WireWG;
  var CFG = { a: 60, L: 300, xLeft: 110, xRight: 110, Ny: 220, y0pix: 110, aw: 0.8, Nmax: 420, z0: 36 };
  var state = { lambda: 90, y0spec: 30, dManual: 5, dAutoOn: true, phase: 0, dPhi: 0.15, paused: false };
  var el = function (id) { return document.getElementById(id); };
  var cvInc = el('cvInc'), cvTot = el('cvTot'), cvScat = el('cvScat');

  function currentD() {
    return state.dAutoOn ? WGM.dAuto(state.lambda, CFG.L, CFG.Nmax) : state.dManual;
  }
  function geom(s) { return { Nx: s.Nx, Ny: s.Ny, y0: CFG.y0pix, a: CFG.a, xLeft: CFG.xLeft, L: CFG.L }; }
  function rebuild() {
    var p = { lambda: state.lambda, a: CFG.a, L: CFG.L, d: currentD(), y0spec: state.y0spec,
      aw: CFG.aw, xLeft: CFG.xLeft, xRight: CFG.xRight, Ny: CFG.Ny, y0pix: CFG.y0pix, z0: CFG.z0 };
    var s = WGM.computeScene(core, WG, p);
    [cvInc, cvTot, cvScat].forEach(function (cv) { cv.width = s.Nx; cv.height = s.Ny; });
    WG.updateOverlays({ inc: cvInc.parentNode, scat: cvScat.parentNode, tot: cvTot.parentNode }, geom(s));
    window.__scene = s;
    if (window.__afterRebuild) window.__afterRebuild(s);
  }

  var A = CFG.a;
  function syncReadouts() {
    var lam = state.lambda, y0 = state.y0spec, d = currentD();
    el('lambdaVal').textContent = (lam / A).toFixed(2) + ' a (' + lam.toFixed(0) + ' 셀 = ' + lam.toFixed(0) + ' mm)';
    el('y0Val').textContent = (y0 / A).toFixed(2) + ' a (' + y0.toFixed(0) + ' 셀 = ' + y0.toFixed(0) + ' mm)';
    el('dVal').textContent = d.toFixed(2) + ' 셀 = ' + d.toFixed(2) + ' mm (d/λ=' + (d / lam).toFixed(3) + ')';
    el('dWire').disabled = state.dAutoOn;
    if (state.dAutoOn) el('dWire').value = Math.round(d); // 자동일 땐 슬라이더 손잡이도 자동값 반영
  }
  var timer = null;
  function scheduleRebuild() { if (timer) clearTimeout(timer);
    timer = setTimeout(function () { rebuild(); timer = null; }, 150); }
  function rebuildNow() { if (timer) { clearTimeout(timer); timer = null; } rebuild(); }
  el('lambda').addEventListener('input', function (e) {
    state.lambda = (+e.target.value) * A; syncReadouts(); scheduleRebuild(); });
  el('y0').addEventListener('input', function (e) {
    state.y0spec = (+e.target.value) * A; syncReadouts(); scheduleRebuild(); });
  el('centerBtn').addEventListener('click', function () {
    state.y0spec = A / 2; el('y0').value = 0.5; syncReadouts(); rebuildNow(); });
  el('dWire').addEventListener('input', function (e) {
    state.dManual = +e.target.value; syncReadouts(); scheduleRebuild(); });
  el('dAuto').addEventListener('change', function (e) {
    if (!e.target.checked) state.dManual = Math.round(currentD()); // 자동→수동: 현재 자동값 이어받아 급변 방지
    state.dAutoOn = e.target.checked; syncReadouts(); rebuildNow(); });
  el('pauseBtn').addEventListener('click', function () {
    state.paused = !state.paused; el('pauseBtn').textContent = state.paused ? '▶ 재개' : '⏸ 일시정지'; });
  el('speed').addEventListener('input', function (e) { state.dPhi = +e.target.value; });

  function applyPreset(id) {
    var m = { '1': [2.4, null], '2': [1.5, null], '3': [0.8, 0.25], '4': [0.55, 1 / 6] };
    var v = m[id]; state.lambda = v[0] * A;
    if (v[1] !== null) { state.y0spec = v[1] * A; el('y0').value = v[1]; }
    el('lambda').value = v[0]; syncReadouts(); rebuildNow();
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-preset]'), function (b) {
    b.addEventListener('click', function () { applyPreset(b.getAttribute('data-preset')); });
  });
  state.lambda = 1.5 * A; state.y0spec = 0.5 * A; syncReadouts();

  function autoScale(field) {
    var Ny = field.Ny, re = field.re, im = field.im, mx = 1e-6;
    var i0 = CFG.xLeft, i1 = CFG.xLeft + Math.round(0.4 * CFG.L);
    for (var i = i0; i < i1; i++) for (var j = 0; j < Ny; j++) {
      var idx = i * Ny + j, v = Math.sqrt(re[idx] * re[idx] + im[idx] * im[idx]);
      if (v > mx) mx = v;
    }
    return mx;
  }
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function frame() {
    var s = window.__scene;
    if (s) {
      if (!state.paused && !reduce) state.phase += state.dPhi;
      var g = geom(s), sc = autoScale(s.tot); // §2 공통 스케일 = tot 기준, 세 패널 동일
      WG.drawField(cvInc.getContext('2d'), s.inc, sc, state.phase);
      WG.drawField(cvTot.getContext('2d'), s.tot, sc, state.phase);
      WG.drawField(cvScat.getContext('2d'), s.scat, sc, state.phase);
      var gi = cvInc.getContext('2d'), gt = cvTot.getContext('2d'), gs = cvScat.getContext('2d');
      WG.drawPlatesWire(gi, g); WG.drawPlatesWire(gt, g); WG.drawPlatesWire(gs, g);
      WG.drawWireDots(gt, s.wiresPixDraw, s.cre, s.cim, state.phase, sc, s.Ny);
      WG.drawWireDots(gs, s.wiresPixDraw, s.cre, s.cim, state.phase, sc, s.Ny);
    }
    requestAnimationFrame(frame);
  }

  function renderReadouts(s) {
    var a = CFG.a, k = s.k, y0spec = state.y0spec, xLeft = CFG.xLeft, y0pix = CFG.y0pix, L = CFG.L;
    var html = '<div class="row"><b>벽 무결성</b>: 누설 |T|=' + s.wallT.toFixed(3) +
      ' , d/λ=' + s.dOverLambda.toFixed(3) +
      (s.dOverLambda > 0.1 || s.wallT > 0.35 ? ' <span class="warn">⚠ 벽 근사 무너짐</span>' : '') +
      ' — 차단 κ 정확도는 |T|보다 엄격(모드 분해 신뢰 d/λ≲0.06)' + '</div>';
    html += '<div class="tcap">└ T = 도선 벽이 새는 정도. 0에 가까울수록 연속 도체판에 가까움(모드 분해 신뢰). 클수록 도선 틈으로 장이 샘.</div>';
    [1, 2, 3].forEach(function (n) {
      var coup = Math.abs(Math.sin(n * Math.PI * y0spec / a));
      var line = '<div class="row mode' + n + '">mode ' + n +
        ': 결합 |sin(nπy₀/a)|=' + coup.toFixed(3);
      if (coup < 0.02) { line += ' — <b>여기되지 않음(마디 위치)</b>'; }
      else {
        var kz = WGM.theoryKz(n, a, k), kap = WGM.theoryKappa(n, a, k);
        var kappas = [1, 2, 3].map(function (m) { return WGM.theoryKappa(m, a, k); }).filter(function (v) { return v; });
        var kappaMin = kappas.length ? Math.min.apply(null, kappas) : null;
        var win = WGM.fitWindowZ(CFG.z0, L, kappaMin);
        if (kz) {
          var mkz = WGM.measureKzN(s.tot, y0pix, a, n, xLeft, win);
          line += ' — 전파: k_z 측정 ' + (mkz != null ? mkz.toFixed(4) : '—') + ' / 이론 ' + kz.toFixed(4) +
            (mkz != null ? ' (' + (mkz / kz * 100).toFixed(0) + '%)' : '');
        } else if (kap) {
          var amp2 = WGM.modeCoefGridN(s.tot, y0pix, a, n);
          var kwin = WGM.kappaWindowN(L, kap, s.d);
          var mkap = WGM.measureKappaN(amp2, xLeft, kwin);
          if (mkap != null) {
            line += ' — 차단: κ 측정 ' + mkap.toFixed(4) + ' / 이론 ' + kap.toFixed(4) +
              ' (' + (mkap / kap * 100).toFixed(0) + '%)';
          } else if (!kwin.resolvable) {
            line += ' — 차단: 이론 κ ' + kap.toFixed(4) + ' — <b>측정 불가</b>(감쇠길이 1/κ=' +
              (1 / kap).toFixed(1) + '셀 < 도선간격 d=' + s.d.toFixed(1) + '셀, 분해능 한계)';
          } else {
            line += ' — 차단: 이론 κ ' + kap.toFixed(4) + ' — <b>측정 불가</b>(수치 바닥/분해능 한계)';
          }
        }
      }
      html += line + '</div>';
    });
    el('readouts').innerHTML = html;
  }

  window.__hoState = state; window.__hoRebuild = rebuild; window.__hoCFG = CFG; window.__hoCurrentD = currentD;
  window.__afterRebuild = function (s) {
    WG.drawModeGraph(el('cvGraph').getContext('2d'), s, CFG);
    renderReadouts(s);
  };
  rebuild(); requestAnimationFrame(frame);
})();
</script>
</body></html>
